version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aerostake_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aerostake_user
      POSTGRES_PASSWORD: aerostake_password
      POSTGRES_DB: aerostake_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerostake_user -d aerostake_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aerostake_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aerostake_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/backend
      - /backend/.venv
    environment:
      - DATABASE_URL=postgresql+asyncpg://aerostake_user:aerostake_password@postgres:5432/aerostake_db
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=["http://localhost:3000", "http://127.0.0.1:3000", "http://localhost:8000"]
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aerostake_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
      - /frontend/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
    name: aerostake_postgres_data
  redis_data:
    name: aerostake_redis_data
