# Aerostake Dev/Staging Frontend Portal Nginx Configuration (/etc/nginx/sites-available/aerostake-dev-app.conf)
server {
    listen 80;
    server_name dev.aerostake.latrics.com dev-aerostake.latrics.com;

    # Prevent search engines from indexing the staging portal
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;

    location / {
        proxy_pass http://127.0.0.1:13420;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
