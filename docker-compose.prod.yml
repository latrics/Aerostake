# ==============================================================================
# AEROSTAKE — PRODUCTION & STAGING DOCKER COMPOSE CONFIGURATION
# Fully isolated from host and local dev.
# Loopback ports parameterized with collision-safe defaults (18410 / 13410).
# ==============================================================================

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    env_file:
      - ${ENV_FILE:-.env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-aerostake_prod_user} -d $${POSTGRES_DB:-aerostake_prod_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    env_file:
      - ${ENV_FILE:-.env.prod}
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-aerostake_prod_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aerostake_prod_db}
      - REDIS_URL=redis://redis:6379/0
    ports:
      # Bound strictly to localhost loopback — safe default 18410 avoids 8000/8001/8080/etc.
      - "127.0.0.1:${API_PORT:-18410}:8000"
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: always
    env_file:
      - ${ENV_FILE:-.env.prod}
    environment:
      - PORT=3000
    ports:
      # Bound strictly to localhost loopback — safe default 13410 avoids 3000/3001/etc.
      - "127.0.0.1:${WEB_PORT:-13410}:3000"
    networks:
      - internal
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
