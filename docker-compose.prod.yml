# ==============================================================================
# AEROSTAKE — PRODUCTION DOCKER COMPOSE CONFIGURATION
# 100% Isolated from local development. Only binds to internal host ports.
# ==============================================================================

networks:
  aerostake_prod_internal:
    driver: bridge
    name: aerostake_prod_network

volumes:
  aerostake_prod_postgres_data:
    name: aerostake_prod_postgres_data
  aerostake_prod_redis_data:
    name: aerostake_prod_redis_data

services:
  postgres:
    image: postgres:16-alpine
    container_name: aerostake_prod_postgres
    restart: always
    env_file:
      - .env.prod
    volumes:
      - aerostake_prod_postgres_data:/var/lib/postgresql/data
    networks:
      - aerostake_prod_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-aerostake_prod_user} -d $${POSTGRES_DB:-aerostake_prod_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: aerostake_prod_redis
    restart: always
    volumes:
      - aerostake_prod_redis_data:/data
    networks:
      - aerostake_prod_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: aerostake_prod_backend
    restart: always
    env_file:
      - .env.prod
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-aerostake_prod_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aerostake_prod_db}
      - REDIS_URL=redis://redis:6379/0
    ports:
      # Bound strictly to localhost loopback — proxied via Nginx reverse proxy
      - "127.0.0.1:8010:8000"
    networks:
      - aerostake_prod_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: aerostake_prod_frontend
    restart: always
    env_file:
      - .env.prod
    ports:
      # Bound strictly to localhost loopback — proxied via Nginx reverse proxy
      - "127.0.0.1:3010:3000"
    networks:
      - aerostake_prod_internal
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
