# ==============================================================================
# AEROSTAKE — LOCAL DEVELOPMENT DOCKER COMPOSE CONFIGURATION (.dev)
# Hot reloading enabled, isolated dev database volume, localhost port bindings.
# ==============================================================================

version: '3.8'

networks:
  aerostake_dev_network:
    driver: bridge
    name: aerostake_dev_network

volumes:
  aerostake_dev_postgres_data:
    name: aerostake_dev_postgres_data
  aerostake_dev_redis_data:
    name: aerostake_dev_redis_data

services:
  postgres:
    image: postgres:16-alpine
    container_name: aerostake_dev_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aerostake_user
      POSTGRES_PASSWORD: aerostake_password
      POSTGRES_DB: aerostake_db
    ports:
      - "5432:5432"
    volumes:
      - aerostake_dev_postgres_data:/var/lib/postgresql/data
    networks:
      - aerostake_dev_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerostake_user -d aerostake_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aerostake_dev_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - aerostake_dev_redis_data:/data
    networks:
      - aerostake_dev_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: aerostake_dev_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/backend
      - /backend/.venv
    environment:
      - DATABASE_URL=postgresql+asyncpg://aerostake_user:aerostake_password@postgres:5432/aerostake_db
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=["http://localhost:3000", "http://127.0.0.1:3000", "http://localhost:8000"]
      - ENVIRONMENT=development
      - DEBUG=True
    env_file:
      - ./backend/.env
    networks:
      - aerostake_dev_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: aerostake_dev_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
      - /frontend/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=development
    networks:
      - aerostake_dev_network
    depends_on:
      - backend
